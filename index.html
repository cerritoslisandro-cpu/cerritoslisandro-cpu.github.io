<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESYF Church - Conectando</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; color: #333; }
        .container { text-align: center; padding: 20px; border-radius: 8px; background: white; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #09f; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Conectando al servidor de MESYF...</h2>
        <p>Por favor, espera un momento.</p>
    </div>

    <script>
        // Intentamos leer el archivo url.txt que el script de Android actualizará
        fetch('url.txt?t=' + str(new Date().getTime())) // Evitamos el caché del navegador
            .then(response => {
                if (!response.ok) throw new Error('No se pudo encontrar la URL activa.');
                return response.text();
            })
            .then(url => {
                const cleanUrl = url.trim();
                if (cleanUrl.startsWith('https://')) {
                    window.location.href = cleanUrl;
                } else {
                    document.body.innerHTML = "<h2>Error: Servidor fuera de línea</h2><p>Vuelve a intentarlo en unos minutos.</p>";
                }
            })
            .catch(error => {
                console.error(error);
                document.body.innerHTML = "<h2>Estado: Servidor en mantenimiento</h2>";
            });
    </script>
</body>
</html>
