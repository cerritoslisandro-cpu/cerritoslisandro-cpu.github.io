<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESYF Church - Acceso</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .card { text-align: center; background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 80%; max-width: 400px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-btn { display: none; background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card" id="status-card">
        <div class="spinner" id="loader"></div>
        <h2 id="msg">Conectando con MESYF...</h2>
        <p id="submsg">Sincronizando túnel seguro</p>
        <div id="retry-btn" class="error-btn" onclick="location.reload()">Reintentar Conexión</div>
    </div>

    <script>
        const startTime = Date.now();
        const timeout = 5000; // 5 segundos exactos

        function checkUrl() {
            const now = Date.now();
            
            // Si pasaron más de 5 segundos, mostramos error
            if (now - startTime > timeout) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('msg').innerText = "Servidor no disponible";
                document.getElementById('submsg').innerText = "GitHub está procesando la última actualización. Espera un momento.";
                document.getElementById('retry-btn').style.display = 'inline-block';
                return;
            }

            fetch('url.txt?t=' + now)
                .then(res => res.text())
                .then(url => {
                    const cleanUrl = url.trim();
                    // Verificamos que sea una URL de Cloudflare válida y no una vieja
                    if (cleanUrl.includes('trycloudflare.com')) {
                        window.location.href = cleanUrl;
                    } else {
                        setTimeout(checkUrl, 1000); // Reintenta cada segundo
                    }
                })
                .catch(() => setTimeout(checkUrl, 1000));
        }

        checkUrl();
    </script>
</body>
</html>
